<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explore a responsive image gallery.">
    <title>Responsive Image Gallery</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <header class="header">
        <h1>Image Gallery</h1>
        <p>Explore moments, places and nature.</p>
    </header>

    <main class="gallery-wrapper">

        <!-- Category filters -->
        <nav class="filter-container" aria-label="Filter gallery">
            <button class="filter-btn active" data-filter="all">
                All
            </button>
            <button class="filter-btn" data-filter="nature">
                Nature
            </button>
            <button class="filter-btn" data-filter="city">
                City
            </button>
            <button class="filter-btn" data-filter="animals">
                Animals
            </button>
        </nav>

        <!-- Images are generated by JavaScript -->
        <section
            class="gallery-grid"
            id="galleryGrid"
            aria-label="Image gallery"
        ></section>

        <p class="empty-message" id="emptyMessage" hidden>
            No images found in this category.
        </p>

    </main>

    <!-- Lightbox -->
    <div
        class="lightbox"
        id="lightbox"
        role="dialog"
        aria-modal="true"
        aria-label="Image viewer"
        aria-hidden="true"
        hidden
    >
        <button
            class="close-btn"
            id="closeLightbox"
            aria-label="Close image viewer"
        >&times;</button>

        <button
            class="nav-btn prev-btn"
            id="prevBtn"
            aria-label="Previous image"
        >&#10094;</button>

        <figure class="lightbox-content">
            <img id="lightboxImage" src="" alt="">
            <figcaption id="imageCaption"></figcaption>
            <p id="imageCounter" aria-live="polite"></p>
        </figure>

        <button
            class="nav-btn next-btn"
            id="nextBtn"
            aria-label="Next image"
        >&#10095;</button>
    </div>

<script type="module" src="app.js"></script>

</body>
</html>
